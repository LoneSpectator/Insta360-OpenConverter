services:
    converter:
        image: ${CONVERTER_IMAGE:-ghcr.io/lonespectator/insta360-openconverter:latest}
        user: "${PUID:-1000}:${PGID:-1000}"
        restart: unless-stopped
        stop_grace_period: 30s
        environment:
            TZ: Asia/Shanghai
        volumes:
            - ${PHOTO_DIR:?Set PHOTO_DIR in .env}:/photo
            - ./data:/data
            - ./sdk:/sdk:ro
        read_only: true
        tmpfs:
            - /tmp:size=256m,mode=1777
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          device_ids: ["${NVIDIA_GPU_ID:-0}"]
                          capabilities: [gpu]
        # 无需端口；日志和健康状态保存在 /data。
