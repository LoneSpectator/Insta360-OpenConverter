name: Test and publish container

on:
    pull_request:
    push:
        branches: [main]
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: container-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install public test dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends ffmpeg libimage-exiftool-perl
            - name: Test scanner, safety, retries, metadata and commands
              run: python -m unittest discover -s tests -v

    image:
        needs: test
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - name: Normalize image name
              id: image
              shell: bash
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
            - uses: docker/login-action@v3
              if: github.event_name != 'pull_request'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/metadata-action@v5
              id: meta
              with:
                  images: ${{ steps.image.outputs.name }}
                  flavor: latest=false
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha
            - name: Build image for runtime tests
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64
                  load: true
                  push: false
                  tags: insta360-openconverter:ci
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - name: Test non-root container entry point and media workflow
              run: |
                  docker run --rm --read-only --tmpfs /tmp:size=256m,mode=1777 insta360-openconverter:ci --help
                  # The SDK double is executable, like the real /data/sdk mount. Docker
                  # makes /tmp tmpfs noexec by default, so fixtures use a separate mount.
                  docker run --rm --read-only --tmpfs /tmp:size=64m,mode=1777 \
                    --tmpfs /test-work:exec,size=256m,mode=1777 -e TMPDIR=/test-work \
                    --entrypoint python3 \
                    --mount "type=bind,src=$PWD/tests,dst=/tests,readonly" \
                    --mount "type=bind,src=$PWD/scripts,dst=/app/scripts,readonly" \
                    insta360-openconverter:ci -m unittest discover -s /tests -v
            - name: Publish tested image
              if: github.event_name != 'pull_request'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
