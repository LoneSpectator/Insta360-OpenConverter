name: Test and publish container

on:
    pull_request:
    push:
        branches: [main]
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: container-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install public test dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends ffmpeg libimage-exiftool-perl
            - name: Test scanner, safety, retries, metadata and commands
              id: tests
              shell: bash
              run: |
                  set -o pipefail
                  {
                      python --version
                      ffmpeg -version
                      exiftool -ver
                      python -m unittest discover -s tests -v
                  } 2>&1 | tee "$RUNNER_TEMP/public-tests.log"
            - name: Show test failure details
              if: failure() && steps.tests.outcome == 'failure'
              run: python3 scripts/report_ci_failure.py "$RUNNER_TEMP/public-tests.log"
            - name: Save failed test log
              if: failure() && steps.tests.outcome == 'failure'
              uses: actions/upload-artifact@v5
              with:
                  name: public-test-logs
                  path: ${{ runner.temp }}/public-tests.log
                  retention-days: 14

    image:
        needs: test
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - name: Normalize image name
              id: image
              shell: bash
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
            - uses: docker/login-action@v3
              if: github.event_name != 'pull_request'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/metadata-action@v5
              id: meta
              with:
                  images: ${{ steps.image.outputs.name }}
                  flavor: latest=false
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha
            - name: Build image for runtime tests
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64
                  load: true
                  push: false
                  tags: insta360-openconverter:ci
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - name: Test non-root container entry point and media workflow
              id: runtime_tests
              shell: bash
              run: |
                  set -o pipefail
                  {
                      docker run --rm --read-only --tmpfs /tmp:size=256m,mode=1777 insta360-openconverter:ci --help
                      # MediaSDK's OpenCV build links GTK even for its command-line entry point.
                      docker run --rm --read-only --entrypoint python3 insta360-openconverter:ci \
                          -c 'import ctypes; [ctypes.CDLL(name) for name in ("libgtk-3.so.0", "libgdk-3.so.0", "libglut.so.3")]'
                      # The SDK double is executable, like the real /data/sdk mount. Docker
                      # makes /tmp tmpfs noexec by default, so fixtures use a separate mount.
                      docker run --rm --read-only --tmpfs /tmp:size=64m,mode=1777 \
                          --tmpfs /test-work:exec,size=256m,mode=1777 -e TMPDIR=/test-work \
                          --entrypoint python3 \
                          --mount "type=bind,src=$PWD/tests,dst=/tests,readonly" \
                          --mount "type=bind,src=$PWD/scripts,dst=/app/scripts,readonly" \
                          insta360-openconverter:ci -m unittest discover -s /tests -v
                  } 2>&1 | tee "$RUNNER_TEMP/container-tests.log"
            - name: Show container test failure details
              if: failure() && steps.runtime_tests.outcome == 'failure'
              run: python3 scripts/report_ci_failure.py "$RUNNER_TEMP/container-tests.log"
            - name: Save failed container test log
              if: failure() && steps.runtime_tests.outcome == 'failure'
              uses: actions/upload-artifact@v5
              with:
                  name: container-test-logs
                  path: ${{ runner.temp }}/container-tests.log
                  retention-days: 14
            - name: Publish tested image
              if: github.event_name != 'pull_request'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
