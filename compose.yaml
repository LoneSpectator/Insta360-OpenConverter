services:
  converter:
    build: .
    image: ${CONVERTER_IMAGE:-insta360-openconverter:local}
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ${PHOTO_DIR:?Set PHOTO_DIR in .env}:/photo
      - ./data:/data
      - ./sdk/media:/data/sdk/media:ro
      - ./sdk/metadata:/data/sdk/metadata:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # 无需端口；日志和健康状态保存在 /data。
