# 所有路径都是容器内路径。只修改 photo_root 还需要相应修改挂载位置。
photo_root = "/photo"
# 扫描周期，单位为分钟；启动时立即扫描，处理中跳过到期批次。
scan_interval_minutes = 60
# 文件最后修改至少 120 秒后才处理；转码结束时再次核对源文件。
settle_seconds = 120
command_timeout = 7200
# 0/0 保留源对应的全景尺寸；显式正数才调整分辨率。
width = 0
height = 0
# 0 沿用源视频码率预算，不固定压低码率。
bitrate = 0
codec = "source"
# 视频的 FlowState 默认关闭；照片独立使用下面的设置。
flowstate = false
# 在 SDK 的照片拼接中启用 FlowState，不追加 JPEG 重编码。
photo_flowstate = true
stitch_type = "optflow"
camera_accessory_type = 0

[sdk]
# 宿主机 sdk 目录只读挂载；放入官方 SDK 包，容器自动准备运行副本。
source_root = "/sdk"
executable = "/data/sdk/media/bin/MediaSDKTest"
models = "/data/sdk/media/bin/models"
library_dirs = ["/data/sdk/media/lib", "/data/sdk/media/bin"]
extra_args = []

[tools]
exiftool = "exiftool"
ffprobe = "ffprobe"

[metadata]
# 使用官方 InsMetaDataSDK 读取源文件；容器首次运行时自动编译适配器。
reader = "/data/sdk/metadata/bin/insta360-metadata"
library_dirs = ["/data/sdk/metadata/lib"]
